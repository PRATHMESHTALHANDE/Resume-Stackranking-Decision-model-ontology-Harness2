[project]
name = "resume-intelligence"
version = "0.1.0"
description = "Open-Source Resume Intelligence, Ranking & Fairness Lab"
authors = [
    { name = "Resume Intelligence Architect", email = "dev@resume-intelligence.local" }
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pymupdf>=1.24.10",
    "python-docx>=1.1.2",
    "sentence-transformers>=3.1.1",
    "torch>=2.4.0",
    "rank-bm25>=0.2.2",
    "networkx>=3.3",
    "scikit-learn>=1.5.2",
    "lightgbm>=4.5.0",
    "ranx>=0.3.18",
    "fairlearn>=0.11.0",
    "numpy>=1.26.4,<2.0.0",
    "scipy>=1.13.0",
    "pandas>=2.2.2",
    "pyyaml>=6.0.2",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.12",
    "laya>=0.4.15",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.8",
    "httpx>=0.27.2",
]
llm = [
    "llama-cpp-python>=0.2.90",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
